name: Scheduler Build Check

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scheduler/**"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scheduler/package-lock.json

      - name: Install dependencies
        working-directory: scheduler
        run: npm install

      - name: TypeScript + Vite build
        working-directory: scheduler
        run: npm run build
