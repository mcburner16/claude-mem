name: Deploy TriageFlow AI Demo

on:
  push:
    branches:
      - main
    paths:
      - 'triageflow-demo/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: triageflow-demo
        run: npm install

      - name: Build
        working-directory: triageflow-demo
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./triageflow-demo/dist
          commit_message: 'deploy: TriageFlow AI demo'
